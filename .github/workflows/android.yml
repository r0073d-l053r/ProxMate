name: Android

on:
  push:
    branches:
      - "**"
    # Version tags build the signed release APK (path filters don't apply to tags).
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android — tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      # Secrets can't be read in `if:` directly; expose whether signing is configured.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      # The signed release APK is built only for main and version tags, never other branches or PRs.
      RELEASE_REF: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        # Reports only for now (abortOnError = false); never fails the build.
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: proxmate-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxmate-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true' && env.RELEASE_REF == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true' && env.RELEASE_REF == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: env.HAS_SIGNING == 'true' && env.RELEASE_REF == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proxmate-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove release keystore
        if: always() && env.HAS_SIGNING == 'true' && env.RELEASE_REF == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Signed release skipped
        if: env.HAS_SIGNING != 'true' || env.RELEASE_REF != 'true'
        run: echo "The signed release APK is built only on main or a version tag, with the signing secrets set; skipped."
