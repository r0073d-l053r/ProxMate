name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories surface even without a push.
    - cron: '17 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      # Uploading results needs GitHub code scanning. That is free on a PUBLIC repo
      # and, on a PRIVATE one, requires GitHub Advanced Security — without it the
      # upload fails with "Code scanning is not enabled for this repository" and the
      # job goes red for a BILLING reason rather than a code one.
      #
      # So: upload where it works, and where it does not, still run the full analysis
      # and gate on the SARIF locally. Skipping the scan entirely on the private repo
      # would be the wrong trade — that is the repo carrying the code the public one
      # never sees.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-sarif
      - name: Gate on CodeQL findings (private repos, where upload is unavailable)
        if: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          # Fail on anything CodeQL would have raised as an alert: an error-level
          # result, or a security finding of high/critical severity (>= 7.0).
          findings=$(jq '[ .runs[].results[]
                           | select(.level == "error"
                                    or ((.properties["security-severity"] // "0") | tonumber) >= 7.0) ]
                         | length' codeql-sarif/*.sarif | paste -sd+ | bc)
          echo "CodeQL error/high findings: ${findings}"
          if [ "${findings}" -gt 0 ]; then
            echo "::error::CodeQL found ${findings} error-level or high-severity issue(s). Results are not uploaded on this repository (code scanning requires GitHub Advanced Security on private repos), so inspect the SARIF artifact below."
            jq -r '.runs[].results[]
                   | select(.level == "error"
                            or ((.properties["security-severity"] // "0") | tonumber) >= 7.0)
                   | "\(.ruleId)	\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)	\(.message.text)"'               codeql-sarif/*.sarif
            exit 1
          fi
      - name: Upload CodeQL SARIF as an artifact (private repos)
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-sarif
          if-no-files-found: warn

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Report known-vulnerable dependencies. `|| true` keeps a single advisory
      # from blocking unrelated PRs — review the surfaced report instead.
      - name: Audit backend
        run: cd backend && npm audit --audit-level=high || true
      - name: Audit frontend
        run: cd frontend && npm audit --audit-level=high || true

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy vulnerability + secret scan
        # report, don't fail the build on third-party advisories (exit-code 0)
        run: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress .

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: proxmate-sbom.cyclonedx.json
